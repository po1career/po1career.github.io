<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>DSE 人生模擬器</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/notosanstc.css">
<style>
  :root{
    --bg:#FAF4E6; --card:#FFFDF8; --ink:#5B3A24; --muted:#8a6f59; --accent:#C9A24B;
    --accent-dark:#A9842F; --link:#936c1f; --accent-soft:#F3E8CE; --border:#E8DCC2;
    --shadow:0 8px 24px rgba(91,58,36,0.08);
    --good:#1f7a4d; --good-bg:#e7f6ee; --mid:#92660a; --mid-bg:#fdf3da;
    --bad:#b3403a; --bad-bg:#fdecea; --unk:#6b7280; --unk-bg:#f1f1ef;
    --ba:#a9842f; --bb:#7d9a78; --bc:#6189a3; --bd:#927ba0; --be:#bd7d54;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","Nunito","PingFang HK",Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 420px at 100% -8%,rgba(201,162,75,0.13),transparent 60%),
      radial-gradient(900px 380px at -8% 2%,rgba(139,168,136,0.11),transparent 55%),var(--bg);
    background-attachment:fixed;color:var(--ink);line-height:1.6;}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px;}
  .hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow);
    padding:24px 26px;margin:6px 0 16px;
    background:linear-gradient(90deg,rgba(255,253,248,0.95) 0%,rgba(255,253,248,0.66) 50%,rgba(255,253,248,0.25) 100%),
      url("images/header-bg.svg") center/cover no-repeat,var(--accent-soft);}
  .hero h1{font-size:1.9rem;margin:0;font-weight:800;position:relative;z-index:1;}
  .hero .subtitle{color:var(--muted);margin:6px 0 0;font-size:0.95rem;position:relative;z-index:1;max-width:52ch;}
  .hero-eyebrow{display:inline-flex;margin-bottom:10px;background:rgba(255,255,255,0.72);color:var(--link);border:1px solid var(--border);
    border-radius:999px;padding:4px 12px;font-weight:800;font-size:0.76rem;letter-spacing:0.1em;position:relative;z-index:1;}
  .hero-sprig{position:absolute;top:-16px;right:-8px;width:160px;opacity:0.5;transform:rotate(6deg);pointer-events:none;}
  .hero-disc{display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;position:relative;z-index:1;background:#fbeee2;
    border:1px solid #e8c9a8;border-left:5px solid var(--accent-dark);border-radius:12px;padding:10px 14px;max-width:70ch;}
  .hero-disc p{margin:0;color:#7a3517;font-size:0.84rem;font-weight:600;}
  /* steps */
  .steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 14px;}
  .steps li{display:flex;align-items:center;gap:6px;font-size:0.82rem;font-weight:700;color:var(--muted);background:#fffdf7;
    border:1px solid var(--border);border-radius:999px;padding:3px 11px 3px 4px;}
  .steps .n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);font-size:0.72rem;}
  .steps li.done{color:var(--good);} .steps li.done .n{background:var(--good-bg);}
  .steps li.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:transparent;}
  .steps li.on .n{background:rgba(255,255,255,0.3);}
  /* panels */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .panel::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),#8BA888);}
  .panel h2{margin:2px 0 8px;font-size:1.2rem;font-weight:800;}
  .hint{color:var(--muted);font-size:0.88rem;margin:0 0 12px;}
  .small{font-size:0.78rem;} .muted{color:var(--muted);}
  .note{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:0.88rem;color:var(--link);font-weight:600;margin:10px 0;}
  .err{color:var(--bad);font-weight:700;font-size:0.88rem;min-height:1.4em;margin-top:8px;}
  .how{margin:0 0 6px;padding-left:1.3em;} .how li{margin:4px 0;}
  /* controls */
  select,input[type=text]{padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:0.95rem;font-family:inherit;background:#fffdf7;color:var(--ink);max-width:100%;}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:0.95rem;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;}
  .btn.small{padding:6px 12px;font-size:0.85rem;}
  .btn-ghost{background:#fffdf7;color:var(--link);border:1px solid var(--border);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.ops button:focus-visible{outline:3px solid #8a5e18;outline-offset:2px;}
  .navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;} .row.wrapping{flex-wrap:wrap;}
  /* grades */
  .gtable{border-collapse:collapse;width:100%;}
  .gtable td{border-bottom:1px solid #f3ecd9;padding:8px 6px;vertical-align:middle;}
  .gtable td:first-child{font-weight:700;width:58%;}
  .gtable td:first-child select{width:100%;font-weight:700;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .seg button{border:none;background:#fffdf7;color:var(--muted);font-family:inherit;font-weight:800;padding:8px 14px;cursor:pointer;}
  .seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;}
  /* interests */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--border);background:#fffdf7;color:var(--ink);border-radius:999px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;}
  .chip.on{background:linear-gradient(135deg,#8BA888,#6f8f6b);color:#fff;border-color:transparent;}
  /* list: the picker (grouped like the Finder+) */
  .picker,.mylist{border-top:1px dashed var(--border);margin-top:14px;padding-top:2px;}
  #l-q{width:100%;margin:0 0 2px;}
  .flabel{font-size:0.74rem;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:10px 0 5px;}
  .chips.sm{gap:6px;} .chips.sm .chip{padding:5px 11px;font-size:0.84rem;}
  .groups{display:flex;flex-wrap:wrap;gap:6px;}
  .gtab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fffdf7;color:var(--ink);border-radius:10px;
    padding:6px 11px;font-family:inherit;font-weight:700;font-size:0.84rem;cursor:pointer;}
  .gtab::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--unk);flex:none;}
  .gtab.g-uq::before{background:var(--good);} .gtab.g-median::before{background:#5d8a5d;} .gtab.g-lq::before{background:var(--mid);}
  .gtab.g-belowlq::before{background:var(--bad);} .gtab.g-inelig::before{background:#a3a3a3;}
  .gtab .n{font-size:0.72rem;font-weight:800;background:var(--accent-soft);color:var(--link);border-radius:999px;padding:0 7px;}
  .gtab.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;}
  .gtab.on::before{background:#fff;} .gtab.on .n{background:rgba(255,255,255,0.3);color:#fff;}
  .ghint{margin:8px 0 10px;}
  .linkbtn{background:none;border:none;padding:0;color:var(--link);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .pcard{display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;
    transition:border-color .15s,box-shadow .15s,transform .15s;}
  .pcard:hover{border-color:var(--accent);box-shadow:0 8px 18px rgba(91,58,36,0.10);transform:translateY(-2px);}
  @media (hover:none){.pcard:hover{transform:none;box-shadow:none;}}
  .pcard.in{border-color:var(--accent);background:#fffaf0;} .pcard.inelig{background:#fffafa;}
  .pc-top{display:flex;align-items:center;gap:8px;} .pc-top .code{color:var(--link);}
  .pc-inst{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pc-name{font-weight:700;font-size:0.9rem;line-height:1.45;}
  .addbtn{flex:none;border:1px solid var(--accent);background:#fffdf7;color:var(--link);border-radius:8px;padding:4px 10px;
    font-family:inherit;font-weight:800;font-size:0.82rem;cursor:pointer;}
  .addbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;}
  .addbtn:disabled{opacity:0.45;cursor:not-allowed;}
  .addbtn:focus-visible,.gtab:focus-visible,.linkbtn:focus-visible{outline:3px solid #8a5e18;outline-offset:2px;}
  .gpos{color:var(--good);font-weight:800;} .gneg{color:var(--bad);font-weight:800;}
  .ptags{display:flex;flex-wrap:wrap;gap:4px;}
  .ptag{font-size:0.7rem;background:var(--accent-soft);color:var(--link);border-radius:6px;padding:1px 7px;font-weight:700;}
  .picker .empty{padding:14px;color:var(--muted);text-align:center;} .more{text-align:center;margin:10px 0 0;}
  /* list: my 20 choices, banded, drag ⠿ or ▲▼ */
  .slots{list-style:none;padding:0;margin:0 0 8px;}
  .bandsep{display:flex;align-items:center;gap:7px;font-size:0.74rem;font-weight:800;color:var(--link);letter-spacing:.05em;
    padding:12px 6px 4px;border-bottom:2px solid var(--accent-soft);}
  .bandsep::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--ba);}
  .bandsep.bB::before{background:var(--bb);} .bandsep.bC::before{background:var(--bc);} .bandsep.bD::before{background:var(--bd);} .bandsep.bE::before{background:var(--be);}
  .bandsep.drop-before{background:var(--accent-soft);}
  .slot{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto auto;grid-template-areas:"drag band name evp ops";
    gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #f3ecd9;background:var(--card);}
  .slot .drag{grid-area:drag;} .slot .chipband{grid-area:band;} .slot .sname{grid-area:name;} .slot .evp{grid-area:evp;} .slot .ops{grid-area:ops;}
  .slot .sname{min-width:0;font-weight:700;font-size:0.92rem;}
  .sscore{display:block;color:var(--muted);font-weight:600;}
  .slot .drag{display:inline-flex;align-items:center;justify-content:center;width:22px;height:30px;color:var(--muted);font-size:1.15rem;
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
  .slot.dragging{opacity:0.5;background:var(--accent-soft);}
  .slot.drop-before{box-shadow:inset 0 3px 0 var(--accent-dark);} .slot.drop-after{box-shadow:inset 0 -3px 0 var(--accent-dark);}
  .slot.flash{animation:slotflash 1.2s ease-out;}
  @keyframes slotflash{from{background:#f6e3b4;}to{background:var(--card);}}
  .evp{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;}
  .otable .pill{margin:1px 0;}
  .slots .empty{padding:14px;color:var(--muted);text-align:center;}
  .ops{display:inline-flex;gap:4px;}
  .ops button{border:1px solid var(--border);background:#fffdf7;color:var(--link);border-radius:7px;cursor:pointer;width:30px;height:30px;font-family:inherit;}
  .ops button:disabled{opacity:0.35;cursor:default;}
  .chipband{display:inline-block;min-width:40px;text-align:center;font-weight:800;font-size:0.8rem;color:#fff;border-radius:8px;padding:3px 8px;}
  .chipband.bA{background:linear-gradient(135deg,var(--accent),var(--ba));} .chipband.bB{background:var(--bb);}
  .chipband.bC{background:var(--bc);} .chipband.bD{background:var(--bd);} .chipband.bE{background:var(--be);}
  .pill{display:inline-block;font-size:0.74rem;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .p-good{background:var(--good-bg);color:var(--good);} .p-mid{background:var(--mid-bg);color:var(--mid);}
  .p-bad{background:var(--bad-bg);color:var(--bad);} .p-unk{background:var(--unk-bg);color:var(--unk);}
  /* results + offers */
  .tablewrap{overflow-x:auto;}
  .rtable,.otable{border-collapse:collapse;width:100%;}
  .rtable th,.rtable td,.otable th,.otable td{border-bottom:1px solid #f3ecd9;padding:8px 8px;text-align:left;vertical-align:top;}
  .rtable th,.otable th{font-size:0.76rem;color:var(--muted);}
  .rtable td.big{font-weight:800;font-size:1.15rem;}
  .rtable tr.up .mk{color:var(--good);font-weight:700;} .rtable tr.down .mk{color:var(--bad);font-weight:700;} .rtable .mk{color:var(--muted);font-size:0.85rem;}
  .tally{font-weight:700;margin:10px 0;}
  .callout{border-radius:12px;padding:11px 14px;font-weight:700;margin:10px 0;}
  .callout.ok{background:var(--good-bg);color:var(--good);border:1px solid #bfe3cf;}
  .callout.warn{background:var(--mid-bg);color:var(--mid);border:1px solid #f0dca8;}
  .callout .small{font-weight:600;}
  details.explain{border:1px solid var(--border);border-radius:12px;padding:8px 14px;margin:10px 0;background:#fffdf7;}
  details.explain summary{cursor:pointer;font-weight:800;color:var(--link);}
  details.explain ul{margin:8px 0;padding-left:1.2em;} details.explain li{margin:4px 0;font-size:0.9rem;}
  .offer-card{text-align:center;border:1px solid var(--border);border-radius:16px;padding:20px;margin:6px 0 12px;
    background:radial-gradient(500px 160px at 50% 0%,rgba(201,162,75,0.22),transparent 70%),#fffdf7;}
  .offer-card.none{background:radial-gradient(500px 160px at 50% 0%,rgba(139,168,136,0.22),transparent 70%),#fffdf7;}
  .offer-card .big-emoji{font-size:2.4rem;}
  .offer-card .headline{font-size:1.15rem;font-weight:800;margin:6px 0;}
  .otable tr.st-offer td{background:var(--good-bg);}
  /* routes */
  .routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .route{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;}
  .route.off{opacity:0.62;}
  .rt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;} .rt-icon{font-size:1.4rem;}
  .route p{margin:6px 0;font-size:0.9rem;}
  .route dl{margin:0 0 8px;font-size:0.84rem;} .route dt{font-weight:800;color:var(--muted);font-size:0.76rem;margin-top:4px;} .route dd{margin:0;}
  .rt-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .rt-foot a{color:var(--link);font-weight:700;font-size:0.85rem;}
  /* end */
  .summary{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:6px 0 12px;}
  .summary dt{font-weight:800;color:var(--muted);font-size:0.85rem;} .summary dd{margin:0;font-weight:700;}
  .real a{color:var(--link);font-weight:800;}
  /* chapter 2: modes, the life screen, timeline, life summary, data page */
  #screen h2:focus,.outcome:focus{outline:none;}
  h3.sub{font-size:1rem;font-weight:800;margin:16px 0 8px;}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .mode{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--border);background:#fffdf7;color:var(--ink);
    border-radius:14px;padding:12px 14px;font-family:inherit;cursor:pointer;}
  .mode b{font-size:1rem;} .mode span{font-size:0.85rem;color:var(--muted);}
  .mode.on{border:2px solid var(--accent-dark);background:var(--accent-soft);padding:11px 13px;}
  .mode:focus-visible,.fcard:focus-visible{outline:3px solid #8a5e18;outline-offset:2px;}
  .cands .hit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid #f3ecd9;font-size:0.9rem;}
  .lifehead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;}
  .lifehead .age{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:2px 12px;border-radius:999px;color:#fff;
    font-size:1.05rem;background:linear-gradient(135deg,#5f7f5b,#4b6848);}
  .lifehead .trk{font-size:1rem;}
  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 18px;margin:10px 0 4px;}
  .meter{display:grid;grid-template-columns:7.2em 1fr 2.2em;align-items:center;gap:8px;font-size:0.88rem;}
  .meter .ml{font-weight:700;white-space:nowrap;}
  .meter .bar{height:10px;border-radius:999px;background:#f1e7cf;overflow:hidden;}
  .meter .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#8BA888);transition:width .4s ease;}
  .meter b{text-align:right;font-variant-numeric:tabular-nums;}
  .outcome{border:1px solid #cfe2cc;background:#f2f8f1;border-radius:12px;padding:10px 14px;margin:12px 0 4px;}
  .outcome p{margin:0;} .outcome p + p{margin-top:6px;}
  .deltas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .dl{font-size:0.8rem;font-weight:800;border-radius:999px;padding:2px 9px;}
  .dl.up{background:var(--good-bg);color:var(--good);} .dl.down{background:var(--bad-bg);color:var(--bad);}
  .focus{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .fcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);
    border-radius:14px;padding:12px 14px;font-family:inherit;cursor:pointer;}
  .fcard b{font-size:0.98rem;} .fcard span{font-size:0.84rem;color:var(--muted);}
  .fcard:hover{border-color:var(--accent);background:#fffaf0;}
  .event{border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:12px 0;
    background:radial-gradient(420px 120px at 0% 0%,rgba(201,162,75,0.16),transparent 70%),#fffdf7;}
  .event h3{margin:8px 0 4px;font-size:1.08rem;} .event p{margin:4px 0 10px;}
  .event .support{color:var(--link);font-weight:700;}
  .tl{list-style:none;padding:0;margin:6px 0;}
  .tl li{display:grid;grid-template-columns:4.2em 1fr;gap:8px;padding:6px 0 6px 10px;border-left:3px solid var(--border);font-size:0.9rem;}
  .tl li.good{border-left-color:#8BA888;} .tl li.warn{border-left-color:#e0b55a;}
  .tl-age{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;}
  .mchips{display:flex;flex-wrap:wrap;gap:8px;}
  .mchip{border:1px solid var(--border);background:#fffdf7;border-radius:999px;padding:4px 12px;font-size:0.88rem;}
  .datapage h4{margin:12px 0 4px;font-size:0.92rem;}
  .datapage a{color:var(--link);font-weight:700;}
  /* phase 3: class mode, projector text, reflection, what if, share image, recent runs, art */
  html.big{font-size:118%;} html.big .wrap{max-width:1100px;}
  .classpill{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:4px 12px;border-radius:999px;
    background:#eef4ec;border:1px solid #cfe2cc;color:#3f6a3b;font-weight:800;font-size:0.84rem;}
  .classrow input{flex:1 1 180px;text-transform:uppercase;letter-spacing:0.08em;font-weight:800;}
  .dailypill{background:#fdf3da;border-color:#e8c25a;color:#7a5a12;display:flex;flex-wrap:wrap;border-radius:14px;line-height:1.5;}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:0.9rem;margin:8px 0 0;cursor:pointer;}
  .toggle input{width:18px;height:18px;accent-color:var(--accent-dark);}
  .reflect{border:1px dashed #d6c08a;background:#fffaf0;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:0.92rem;}
  .reflect p{margin:0;} .reflect p + p{margin-top:6px;}
  .art{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:14px;margin:4px 0 12px;}
  .whatif,.sharebox{border-top:1px solid var(--border);margin-top:16px;padding-top:4px;}
  .wi-alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;}
  .cmpbox{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:12px 0;background:#fffdf7;}
  .cmpbox h4{margin:0 0 6px;font-size:1rem;} .cmpbox h4:focus{outline:none;}
  .cmp{border-collapse:collapse;width:100%;margin:6px 0;}
