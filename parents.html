  <style>
    .pa-wrap{max-width:940px;margin:0 auto;padding:8px 0 44px}

    .pa-hero{position:relative;overflow:hidden;border-radius:22px;margin:14px 0 22px;
      background:linear-gradient(135deg,#6a8f5b 0%,#3a7ca5 55%,#5b6fa8 110%);
      box-shadow:0 16px 36px rgba(46,58,80,.26);color:#fff;
      display:flex;align-items:center;gap:18px;padding:30px 30px}
    .pa-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 88% 12%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
    .pa-hero-text{flex:1;min-width:0;position:relative;z-index:1}
    .pa-hero-text h1{font-family:var(--font-display);font-weight:800;font-size:2.1rem;margin:0 0 8px;line-height:1.18;text-shadow:0 2px 10px rgba(0,0,0,.18)}
    .pa-hero-text p{margin:0;font-size:1.04rem;line-height:1.6;max-width:54ch;color:#f1f6f0;opacity:.97}
    .pa-hero-art{flex:none;width:120px;height:120px;position:relative;z-index:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
    @media(max-width:680px){ .pa-hero{padding:24px 22px} .pa-hero-art{display:none} .pa-hero-text h1{font-size:1.7rem} }

    .pa-h{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.45rem;margin:34px 0 6px;display:flex;align-items:center;gap:10px}
    .pa-sub{color:var(--brown-soft);font-size:.95rem;margin:0 0 16px}

    .pa-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .pa-card{background:#fffdf8;border:1px solid #ece0c4;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
    .pa-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;margin-bottom:10px;
      background:linear-gradient(135deg,var(--c,#C9A24B),var(--c2,#a9842f));box-shadow:0 6px 14px rgba(0,0,0,.16)}
    .pa-card h3{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.08rem;margin:0 0 6px}
    .pa-card p{color:#5c4a3a;font-size:.92rem;line-height:1.6;margin:0}
    .pa-card a{font-weight:800;color:var(--gold-dark)}

    /* timeline */
    .pa-tl{position:relative;margin:6px 0 0;padding-left:26px}
    .pa-tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--sage))}
    .pa-step{position:relative;padding:10px 0 14px}
    .pa-step::before{content:"";position:absolute;left:-22px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #fffdf8;box-shadow:0 0 0 2px var(--gold)}
    .pa-when{font-family:var(--font-display);font-weight:800;color:var(--gold-dark);font-size:.92rem}
    .pa-what{color:#5c4a3a;font-size:.93rem;line-height:1.6;margin:2px 0 0}

    /* support do / avoid */
    .pa-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:640px){ .pa-two{grid-template-columns:1fr} }
    .pa-col{border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
    .pa-col.good{background:#eef4ea;border:1px solid #cfe0c5}
    .pa-col.avoid{background:#fbeee2;border:1px solid #e8c9a8}
    .pa-col h3{font-family:var(--font-display);font-weight:800;font-size:1.06rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .pa-col.good h3{color:#3f6b3a}
    .pa-col.avoid h3{color:#9a5413}
    .pa-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
    .pa-col li{display:flex;gap:9px;font-size:.92rem;line-height:1.55;color:#4a4033}
    .pa-col li::before{flex:none;font-weight:800}
    .pa-col.good li::before{content:"✓";color:#4e8a45}
    .pa-col.avoid li::before{content:"–";color:#c0792b}

    .pa-note{margin:28px auto 0;max-width:74ch;color:var(--brown);font-size:.86rem;background:#f6ecd2;border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;line-height:1.7}
    nav.main a.active{background:var(--beige)}

    /* dark-mode tweaks for this page's literals */
  </style>
