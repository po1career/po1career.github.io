<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Staff Area</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/notosanstc.css">
<style>
  :root {
    --bg: #FAF4E6; --card: #FFFDF8; --ink: #5B3A24; --muted: #8a6f59;
    --accent: #C9A24B; --accent-dark: #A9842F; --link: #936c1f;
    --accent-soft: #F3E8CE; --border: #E8DCC2; --shadow: 0 8px 24px rgba(91,58,36,0.08);
    --vsafe: #1f7a4d; --vsafe-bg: #e7f6ee;
    --safe:  #4d7c4d; --safe-bg:  #eef5e9;
    --mod:   #92660a; --mod-bg:   #fdf3da;
    --risky: #b3403a; --risky-bg: #fdecea;
    --unk:   #6b7280; --unk-bg:   #f1f1ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Nunito", "Noto Sans TC", "PingFang HK", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 420px at 100% -8%, rgba(201,162,75,0.13), transparent 60%),
      radial-gradient(900px 380px at -8% 2%, rgba(139,168,136,0.11), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.5;
  }
  .lockscreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background:
      radial-gradient(820px 320px at 50% -6%, rgba(201,162,75,0.18), transparent 62%),
      radial-gradient(640px 260px at 12% 112%, rgba(139,168,136,0.13), transparent 60%),
      var(--bg); }
  .lockbox { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .lockbox::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
  .lock-icon { width: 66px; height: 66px; margin: 6px auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: radial-gradient(circle at 50% 35%, #fff, var(--accent-soft)); border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(169,132,47,0.18); }
  .lockbox h2 { margin: 0; font-size: 1.3rem; font-weight: 800; }
  .lock-zh { margin: 2px 0 14px; color: var(--ink); font-size: 1.05rem; }
  .lock-sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; line-height: 1.5; }
  .lockbox input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; margin-bottom: 12px; text-align: center; font-family: inherit; background: #fffdf7; color: var(--ink); }
  .lockbox button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; font-size: 1rem; cursor: pointer; font-family: inherit; font-weight: 800; box-shadow: 0 6px 16px rgba(169,132,47,.3); }
  .lockbox button:hover { filter: brightness(1.05); }
  .lock-err { color: #b91c1c; font-size: 0.85rem; min-height: 20px; margin-top: 10px; }
  .lockbox .home-link { display: inline-block; color: var(--link); text-decoration: none; font-size: 0.9rem; font-weight: 700; margin: 14px 0 0; }
  .lockbox .home-link:hover { text-decoration: underline; }
  #report { display: none; }
</style>
</head>
<body>
<div id="lock" class="lockscreen">
  <div class="lockbox">
    <div class="lock-icon">🔒</div>
    <h2>Staff only</h2>
    <p class="lock-zh">只供教職員使用</p>
    <p class="lock-sub">PLK No.1 W.H. Cheung College<br>保良局第一張永慶中學</p>
    <input type="text" id="userid" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="User ID 用戶名稱" />
    <input type="password" id="passcode" autocomplete="off" placeholder="Password 密碼" />
    <button id="unlock-btn" type="button">Sign in 登入</button>
    <div id="lock-err" class="lock-err"></div>
    <a href="index.html" class="home-link">← Back to home 返回主頁</a>
  </div>
</div>
<div id="app" class="wrap" style="display:none"></div>
<div id="report"></div>
<script src="jupas-eval-loader.js?v=2"></script>
</body>
</html>
