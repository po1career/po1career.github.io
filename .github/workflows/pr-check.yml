name: PR check

# Safety net for changes from any agent (Codex, Claude) or human. Runs on PRs (gating,
# so nothing merges red) and on branch pushes (informational). Does NOT touch the built-in
# GitHub Pages deployment. All checks live in tools/check.mjs — run the same thing locally:
#     node tools/check.mjs --base origin/main
# See AGENTS.md for the rules these checks enforce.
# NOTE: the job id `check` is the required status in the `protect-main` ruleset — don't rename it.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Site checks (tools/check.mjs)
        env:
          # Optional passcode-leak guard: repo secret, one passcode per line.
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            node tools/check.mjs --base "origin/$BASE_REF"
          else
            node tools/check.mjs
          fi
