  <style>
    .fq-wrap{max-width:900px;margin:0 auto;padding:8px 0 40px}
    .fq-title{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:2.1rem;margin:14px 0 6px;text-align:center}
    .fq-sub{color:var(--brown-soft);max-width:64ch;margin:0 auto 14px;text-align:center;font-size:1.02rem}

    /* jump pills */
    .fq-jump{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
    .fq-jump a{background:#fffdf8;border:1.5px solid #e6d8b6;color:var(--gold-dark);font-weight:800;
      font-size:.84rem;padding:6px 14px;border-radius:999px;text-decoration:none}
    .fq-jump a:hover{background:var(--beige);text-decoration:none}

    .fq-h{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.4rem;margin:30px 0 6px;display:flex;align-items:center;gap:10px}
    .fq-h .em{font-size:1.2rem}
    .fq-hint{color:var(--brown-soft);font-size:.92rem;margin:0 0 14px}

    /* glossary grid */
    .gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
    .gl-card{background:#fffdf8;border:1px solid #ece0c4;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .gl-card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(91,58,36,.18);border-color:var(--gold)}
    .gl-term{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.05rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .gl-abbr{font-size:.72rem;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-dark));padding:2px 8px;border-radius:999px}
    .gl-def{color:#5c4a3a;font-size:.9rem;line-height:1.55;margin:7px 0 0}

    /* FAQ accordion */
    .faq-list{display:flex;flex-direction:column;gap:10px}
    .faq{background:#fffdf8;border:1px solid #ece0c4;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .faq:hover,.faq:focus-within{transform:translateY(-4px);box-shadow:0 16px 30px rgba(91,58,36,.18);border-color:var(--gold)}
    .faq[open]{border-color:var(--gold)}
    .faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px;font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.02rem;outline:none}
    .faq summary::-webkit-details-marker{display:none}
    .faq summary:focus-visible{box-shadow:0 0 0 3px var(--gold) inset}
    .faq .qmark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,var(--gold),var(--sage))}
    .faq .chev{margin-left:auto;color:var(--brown-soft);transition:transform .2s ease}
    .faq[open] .chev{transform:rotate(180deg)}
    .faq .ans{padding:2px 18px 16px 56px;color:#5c4a3a;font-size:.95rem;line-height:1.7}
    .faq .ans a{font-weight:800;color:var(--gold-dark)}

    .fq-note{margin:28px auto 0;max-width:72ch;color:var(--brown);font-size:.86rem;background:#f6ecd2;border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;line-height:1.7}
    nav.main a.active{background:var(--beige)}
    .brand{cursor:default}

    @media (prefers-reduced-motion:reduce){
      .gl-card,.faq{transition:none}
      .gl-card:hover,.faq:hover,.faq:focus-within{transform:none}
    }

    /* dark-mode tweaks for this page's literals */
  </style>
</head>
