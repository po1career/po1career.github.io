<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>PLK No.1 — Career Team</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="fonts/notosanstc.css">
  <style>
    :root{ --bg:#FAF4E6; --card:#FFFDF8; --brown:#5B3A24; --brown-soft:#8a6f59;
           --gold:#C9A24B; --gold-dark:#A9842F; --beige:#F3E8CE; --border:#E8DCC2; --link:#936c1f; }
    *{box-sizing:border-box}
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      font-family:"Nunito","Noto Sans TC","PingFang HK",Helvetica,Arial,sans-serif; color:var(--brown);
      background:
        radial-gradient(1000px 380px at 100% -8%, rgba(201,162,75,0.14), transparent 60%),
        radial-gradient(820px 340px at -8% 4%, rgba(139,168,136,0.12), transparent 55%),
        var(--bg); }
    .box{ position:relative; overflow:hidden; background:var(--card); border:1px solid var(--border);
      border-radius:22px; box-shadow:0 12px 36px rgba(91,58,36,0.10); padding:40px 34px;
      max-width:460px; width:100%; text-align:center; }
    .box::before{ content:""; position:absolute; left:0; top:0; width:100%; height:6px;
      background:linear-gradient(90deg, var(--gold), var(--gold-dark)); }
    .logo{ width:96px; height:96px; border-radius:50%; object-fit:cover; display:block; margin:6px auto 14px;
      border:3px solid var(--gold); box-shadow:0 6px 16px rgba(169,132,47,.25); }
    .school{ font-weight:800; font-size:1.15rem; }
    .dept{ color:var(--brown-soft); font-weight:700; margin-top:2px; font-size:0.95rem; }
    h1{ font-size:1.55rem; margin:22px 0 6px; font-weight:800; }
    .zh{ font-size:1.15rem; margin:0 0 16px; color:var(--brown); }
    p.msg{ color:var(--brown-soft); line-height:1.75; margin:0; font-size:0.95rem; }
    .badge{ display:inline-block; margin-top:20px; background:var(--beige); color:var(--link);
      border-radius:999px; padding:6px 16px; font-weight:800; font-size:0.8rem; letter-spacing:.04em; }
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="images/logo.jpg" alt="Career Team logo">
    <div class="school">PLK No.1 W.H. Cheung College</div>
    <div class="dept">Career Team · 升學輔導及生涯規劃組</div>
    <h1>We'll be back soon</h1>
    <p class="zh">網站維護中，敬請期待</p>
    <p class="msg">
      Our website is being updated and will be available again shortly. Thank you for your patience.<br>
      本網站正在更新，稍後將重新開放，敬請耐心等候。
    </p>
    <span class="badge">Coming soon · 即將回來</span>
  </main>
</body>
</html>
