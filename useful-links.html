  <style>
    .ul-wrap{max-width:980px;margin:0 auto;padding:8px 0 30px}
    .ul-title{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:2.1rem;margin:14px 0 6px;text-align:center}
    .ul-sub{color:var(--brown-soft);max-width:62ch;margin:0 auto 6px;text-align:center;font-size:1.02rem}

    .link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:6px}
    .link-card{display:flex;align-items:center;gap:16px;background:#fffdf8;border:1px solid #ece0c4;border-radius:16px;padding:15px 18px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .link-card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(91,58,36,.18);border-color:var(--gold);text-decoration:none}
    .link-card:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px}
    .uni-crest{position:relative;width:64px;height:64px;flex:none;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,var(--c),var(--c2));box-shadow:0 6px 14px rgba(0,0,0,.22)}
    .crest-abbr{position:relative;z-index:1;color:#fff;font-family:var(--font-display);font-weight:800;line-height:1}
    .uni-crest.len-2 .crest-abbr{font-size:1.45rem}
    .uni-crest.len-3 .crest-abbr{font-size:1.2rem}
    .uni-crest.len-4 .crest-abbr{font-size:1rem}
    .uni-crest.len-5 .crest-abbr{font-size:.8rem;letter-spacing:-.02em}
    .crest-cap{position:absolute;width:66px;height:66px;right:-15px;bottom:-17px;color:#fff;opacity:.17}
    .link-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .link-name{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.04rem;line-height:1.3}
    .link-sub{color:var(--brown-soft);font-size:.84rem;font-weight:600}
    .link-go{flex:none;color:var(--gold-dark);font-weight:800;font-size:1.15rem}
    .link-card:hover .link-go{transform:translate(2px,-2px)}
    .link-go{transition:transform .16s ease}

    /* EDB feature card */
    .edb{display:flex;gap:22px;align-items:center;background:linear-gradient(135deg,#fffdf8,#f6f2e6);border:1px solid #e6dab9;border-radius:20px;padding:20px 24px;box-shadow:var(--shadow);flex-wrap:wrap}
    .edb-ill{width:120px;height:120px;flex:none;filter:drop-shadow(0 8px 16px rgba(95,125,89,.28))}
    .edb-body{flex:1;min-width:240px}
    .edb-org{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-dark)}
    .edb-name{font-family:var(--font-display);font-weight:800;color:var(--brown);font-size:1.4rem;margin:3px 0 6px}
    .edb-desc{color:#5c4a3a;margin:0 0 14px;max-width:62ch;line-height:1.7}
    .edb-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;font-weight:800;padding:11px 22px;border-radius:12px;text-decoration:none;box-shadow:0 6px 16px rgba(169,132,47,.3)}
    .edb-btn:hover{filter:brightness(1.06);text-decoration:none}

    .ext-note{margin:28px auto 0;max-width:72ch;color:var(--brown);font-size:.85rem;background:#f6ecd2;border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;line-height:1.7}
    nav.main a.active{background:var(--beige)}
    a.brand{text-decoration:none}
  </style>
