<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>Subject Streaming Tool — PLK No.1 Career Team</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/notosanstc.css">
<style>
  /* ---- site palette (cream / brown / gold / sage), self-hosted fonts ---- */
  :root{ --bg:#FAF4E6; --card:#FFFDF8; --ink:#5B3A24; --muted:#8a6f59; --line:#E8DCC2;
         --border:#E8DCC2;
         --brand:#C9A24B; --brand-d:#A9842F;
         --accent:#C9A24B; --accent-dark:#A9842F; --accent-soft:#F3E8CE; --link:#936c1f;
         --sage:#8BA888; --sage-d:#5f7d59;
         --good:#5b8a5b; --warn:#c0512b;
         --chip:#F3E8CE; --chip-on:#C9A24B; --bad:#b3401f;
         --shadow:0 8px 24px rgba(91,58,36,0.08); }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 "Nunito","Noto Sans TC","PingFang HK",Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  .wrap{max-width:960px;margin:0 auto;padding:20px 18px 80px}

  /* ---- hero banner (matches the JUPAS Finder / Evaluator) ---- */
  .hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--border);
        box-shadow:var(--shadow);padding:24px 26px;margin:0 0 20px;
        background:
          linear-gradient(90deg, rgba(255,253,248,0.95) 0%, rgba(255,253,248,0.66) 46%, rgba(255,253,248,0.20) 100%),
          url("images/header-bg.svg") center/cover no-repeat,
          var(--accent-soft);}
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;position:relative;z-index:1;margin:0}
  .hero-titles{max-width:64ch}
  .hero h1{font-size:1.95rem;margin:0;font-weight:800;color:var(--ink)}
  .hero .subtitle{margin:8px 0 0;color:var(--muted);font-size:0.95rem;line-height:1.55}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;
        background:rgba(255,255,255,0.72);color:var(--link);border:1px solid var(--border);
        border-radius:999px;padding:4px 12px;font-weight:800;font-size:0.74rem;letter-spacing:0.1em}
  .hero-sprig{position:absolute;top:-16px;right:-8px;width:168px;opacity:0.5;transform:rotate(6deg);
        pointer-events:none;z-index:0}
  @media(max-width:540px){ .hero{padding:20px 18px} .hero h1{font-size:1.55rem} .hero-sprig{width:120px;opacity:0.4} }
  .home-link{display:inline-block;color:var(--link);text-decoration:none;font-size:0.9rem;margin-bottom:12px;font-weight:700}
  .home-link:hover{text-decoration:underline}
  .langtog{flex:none;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);padding:3px}
  .langbtn{border:0;background:transparent;padding:6px 14px;cursor:pointer;font:inherit;font-weight:700;color:var(--muted);border-radius:999px}
  .langbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
  .disc{background:#fbeee2;border:1px solid #e8c9a8;border-left:5px solid var(--accent-dark);
        border-radius:12px;padding:12px 16px;margin:16px 0 4px;color:#7a3517;font-size:13.5px;
        font-weight:600;line-height:1.6;box-shadow:var(--shadow)}
  .contra{background:#f7e6e0;border:1px solid #e3b9a8;border-left:4px solid var(--bad);
          border-radius:10px;padding:11px 14px;margin:4px 0 12px;color:#8a1c12;font-size:13.5px}
  .contra div+div{margin-top:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:20px;margin:16px 0;box-shadow:var(--shadow);transition:border-color .16s ease,box-shadow .16s ease}
  .card:hover{border-color:#dcc99a}
  .q{font-weight:600;margin:0 0 4px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  .remark{color:var(--warn);font-size:13px;margin:0 0 12px;font-weight:500}
  .selrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink)}
  .selrow select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;max-width:100%}
  .step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;text-align:center;
        background:linear-gradient(135deg,var(--accent),var(--sage));color:#fff;border-radius:50%;
        font-size:13px;font-weight:800;margin-right:9px;vertical-align:middle;
        box-shadow:0 3px 8px rgba(169,132,47,.25)}
  .q{display:flex;align-items:center}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px 12px;cursor:pointer}
  .opt.on{border-color:var(--brand);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--brand)}
  .opt b{display:block}.opt span{color:var(--muted);font-size:12px}

  /* ---- the two-divider ranked list ---- */
  .zonekey{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px;font-size:12px}
  .zk{padding:3px 9px;border-radius:6px;font-weight:600}
  .zk.acc{background:#e9f0e6;color:var(--sage-d)} .zk.rather{background:#fdf0db;color:var(--warn)} .zk.dnw{background:#f7e6e0;color:var(--bad)}
  .ranklist{margin-top:4px}
  .rankrow{border:1px solid #cdddc4;border-radius:9px;padding:8px 10px;margin-bottom:6px;background:#eef3ea}
  .rankrow.acc{background:#eef3ea;border-color:#cdddc4}
  .rankrow.rather{background:#fdf0db;border-color:#f0d29a}
  .rankrow.dnw{background:#f7e6e0;border-color:#e3b9a8}
  .rankrow.drag{cursor:grab}
  .rankrow.dragover{outline:2px dashed var(--brand);outline-offset:1px}
  .rankhead{display:flex;align-items:center;gap:8px}
  .rankrow .ord{width:24px;height:24px;line-height:24px;text-align:center;background:var(--sage-d);
                color:#fff;border-radius:50%;font-size:12px;font-weight:600;flex:none}
  .rankrow .ordband{width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
                    font-size:13px;font-weight:700;flex:none;color:#fff}
  .rankrow .ordband.rather{background:var(--warn)} .rankrow .ordband.dnw{background:var(--bad)}
  .rankrow .nm{flex:1;font-weight:500}
  .rankrow .nm small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
  .rowbtns{display:flex;gap:4px}
  .rankrow button,.divider button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;
                width:26px;height:26px;font-size:13px}
  .rankrow button:hover,.divider button:hover{border-color:var(--brand)}
  .rankrow button:disabled,.divider button:disabled{opacity:.35;cursor:not-allowed}
  .divider{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px;
           padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.03em}
  .divider.rather{background:#fff0db;color:var(--warn);border:1px dashed var(--warn)}
  .divider.dnw{background:#fde0de;color:var(--bad);border:1px dashed var(--bad)}
  .divider .dlab{flex:1;text-align:center}
  .marksrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:7px 0 0 30px;font-size:12.5px;color:var(--muted)}
  .marksrow label{display:flex;align-items:center;gap:5px}
  .marksrow input{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font:inherit}
  .marksrow .hylab{font-weight:600;color:var(--ink)}
  .marksrow .mknote{color:var(--warn);font-size:11.5px}
  .listtools{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;
        font:inherit;font-size:12.5px;color:var(--brand);font-weight:600}
  .tool:hover{border-color:var(--brand)}
  .ranklist.nomarks .marksrow{display:none}
  #orderNudge{color:var(--warn)}
  @media(max-width:430px){
    .rankrow .nm{font-size:14px}
    .marksrow{margin-left:6px;gap:7px}
    .marksrow input{width:52px}
    .rankrow button,.divider button{width:30px;height:30px}
    .listtools .tool{flex:1 1 auto;text-align:center}
  }

  .meta input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .meta{display:flex;gap:8px;flex-wrap:wrap}
  .go{display:block;width:100%;padding:14px;border:0;border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-dark));
      color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 6px 16px rgba(169,132,47,.3)}
  .go:hover{filter:brightness(1.06)} .go:disabled{background:#dcc99a;filter:none;box-shadow:none;cursor:not-allowed}
  #out{display:none}
  .row{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-bottom:1px solid var(--line)}
  .row:nth-child(odd){background:#fdf8ee}
  .rk{font-weight:700;color:var(--brand);width:38px;flex:none}
  .cl{color:var(--muted);font-size:12px;width:80px;flex:none}
  .why{color:var(--good);font-size:12px;margin-left:auto;text-align:right}
  @media(max-width:620px){
    .row{flex-wrap:wrap} .cl{width:auto}
    .why{margin-left:50px;text-align:left;width:100%;margin-top:2px}
  }
  .adv{background:#fff8ec;border:1px solid #ffe2b8;border-radius:10px;padding:12px 14px;margin-top:14px}
  .adv b{color:var(--warn)} .adv ul{margin:6px 0 0;padding-left:18px} .adv li{margin:4px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{padding:11px 16px;border-radius:10px;border:1px solid var(--brand);background:var(--card);
       color:var(--link);font-weight:700;cursor:pointer}
  .btn:hover{background:var(--accent-soft)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent-dark);color:#fff;box-shadow:0 6px 16px rgba(169,132,47,.3)}
  .btn.primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--accent),var(--accent-dark))}
  .warnmsg{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
  details{margin-top:14px} summary{cursor:pointer;color:var(--brand);font-weight:600}
  .full{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
  .full table{width:100%;border-collapse:collapse;font-size:13px}
  .full td{padding:4px 8px;border-bottom:1px solid var(--line)}

  /* ---- printable reply slip (answers + signatures), bilingual ---- */
  #printArea{max-width:820px;margin:0 auto;padding:10px;color:#000}
  .pdf-head{text-align:center;margin-bottom:8px}
  .pdf-head .sch{font-weight:700;font-size:15px}
  .pdf-head .ttl{font-size:13px;margin-top:2px}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0}
  #printArea .stu td{padding:4px 6px;font-size:12px}
  #printArea h3{font-size:13px;margin:14px 0 4px;border-bottom:1px solid #000;padding-bottom:3px}
  #printArea .kv td{border:1px solid #999;padding:4px 8px;font-size:12px}
  #printArea .kv .k{width:42%;font-weight:600;background:#f3f3f3}
  #printArea .marks th,#printArea .marks td{border:1px solid #999;padding:4px 8px;font-size:12px;text-align:left;vertical-align:top}
  #printArea .marks .zh{color:#555;font-size:10px}
  #printArea .marks .note{color:#b00;font-size:10px}
  .pdf-note{font-size:10px;color:#444;margin-top:10px}
  .sigrow{display:flex;align-items:flex-end;gap:10px;margin:18px 0}
  .sigrow .lab{white-space:nowrap;font-weight:600;font-size:12px}
  .sigrow .line{flex:1;border-bottom:1px solid #000;min-height:1px}
  .pdf-sig{margin-top:24px}
  @media screen{ #printArea{display:none} }
  @media print{
    .wrap{display:none !important}
    #printArea{display:block !important}
    @page{margin:14mm}
    .pdf-sig{page-break-inside:avoid}
  }

  /* ---- soft brand glow behind the page (CSP-safe gradients only) ---- */
  body{
    background:
      radial-gradient(1200px 420px at 100% -8%, rgba(201,162,75,0.13), transparent 60%),
      radial-gradient(900px 380px at -8% 2%, rgba(139,168,136,0.11), transparent 55%),
      var(--bg);
    background-attachment:fixed;
  }

  /* ---- passcode lock screen (matches the JUPAS / DSE gate) ---- */
  .lockscreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(820px 320px at 50% -6%, rgba(201,162,75,0.18), transparent 62%),
      radial-gradient(640px 260px at 12% 112%, rgba(139,168,136,0.13), transparent 60%),
      var(--bg); }
  .lockbox{ position:relative; overflow:hidden; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:36px 28px; max-width:380px; width:100%; text-align:center; box-shadow:var(--shadow); }
  .lockbox::before{ content:""; position:absolute; left:0; top:0; width:100%; height:5px;
    background:linear-gradient(90deg, var(--accent), var(--accent-dark)); }
  .lock-icon{ width:66px; height:66px; margin:6px auto 12px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.7rem;
    background:radial-gradient(circle at 50% 35%, #fff, var(--accent-soft));
    border:1px solid var(--border); box-shadow:0 6px 16px rgba(169,132,47,0.18); }
  .lockbox h2{ margin:0; font-size:1.3rem; font-weight:800; color:var(--ink); }
  .lock-zh{ margin:2px 0 14px; color:var(--ink); font-size:1.05rem; }
  .lock-sub{ color:var(--muted); font-size:0.85rem; margin:0 0 18px; line-height:1.5; }
  .lockbox input{ width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
    font-size:1rem; margin-bottom:12px; text-align:center; font-family:inherit; background:#fffdf7; color:var(--ink); }
  .lockbox button{ width:100%; padding:11px; border:none; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff; font-size:1rem;
    cursor:pointer; font-family:inherit; font-weight:800; box-shadow:0 6px 16px rgba(169,132,47,.3); }
  .lockbox button:hover{ filter:brightness(1.05); }
  .lock-err{ color:#b91c1c; font-size:0.85rem; min-height:20px; margin-top:10px; }
  .lockbox .home-link{ margin:14px 0 0; }
</style>
</head>
<body>
<div id="lock" class="lockscreen">
  <div class="lockbox">
    <div class="lock-icon">🔒</div>
    <h2>Enter passcode</h2>
    <p class="lock-zh">請輸入通行碼</p>
    <p class="lock-sub">For PLK No.1 W.H. Cheung College students only<br>只供保良局第一張永慶中學學生使用<br><br>🔑 No passcode yet? Ask your Career teacher.<br>未有通行碼？請向升學輔導老師索取。</p>
    <input type="password" id="passcode" autocomplete="off" placeholder="Passcode 通行碼" />
    <button id="unlock-btn" type="button">Unlock 解鎖</button>
    <div id="lock-err" class="lock-err"></div>
    <a href="index.html" class="home-link">← Back to home 返回主頁</a>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
<a href="index.html" class="home-link">← Back to home 返回主頁</a>
<div class="hero">
  <img class="hero-sprig" src="images/sprig.svg" alt="" aria-hidden="true">
  <header class="hero-top">
    <div class="hero-titles">
      <span class="hero-eyebrow">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 3 1 8l11 5 9-4.09V15h2V8L12 3z" fill="currentColor"></path>
          <path d="M5 11.6V15c0 1.66 3.13 3 7 3s7-1.34 7-3v-3.4l-7 3.18-7-3.18z" fill="currentColor" opacity=".55"></path>
        </svg>
        <span data-i18n="eyebrow"></span>
      </span>
      <h1 data-i18n="title"></h1>
      <p class="subtitle" data-i18n="sub"></p>
    </div>
    <div class="langtog">
      <button class="langbtn on" data-l="en">EN</button>
      <button class="langbtn" data-l="zh">中文</button>
    </div>
  </header>
</div>

<div class="disc" data-i18n="disclaimer"></div>

<div class="card meta">
  <input id="m_class" data-i18n-ph="meta_class" size="10">
  <input id="m_no" data-i18n-ph="meta_no" size="6">
  <input id="m_name" data-i18n-ph="meta_name" size="20">
  <input id="m_sex" data-i18n-ph="meta_sex" size="6">
</div>

<div class="card">
  <p class="q"><span class="step">1</span><span data-i18n="q1"></span></p>
  <div class="opts" id="q_size">
    <div class="opt" data-v="3"><b data-i18n="opt3"></b></div>
    <div class="opt" data-v="2"><b data-i18n="opt2"></b></div>
    <div class="opt" data-v="open"><b data-i18n="optOpen"></b></div>
  </div>
  <div id="firmWrap" style="display:none;margin-top:10px">
    <p class="hint" data-i18n="size_firm_q" style="margin-bottom:6px"></p>
    <div class="opts" id="q_firm">
      <div class="opt on" data-v="firm"><b data-i18n="firm"></b><span data-i18n="firm_s"></span></div>
      <div class="opt" data-v="flex"><b data-i18n="flex"></b><span data-i18n="flex_s"></span></div>
    </div>
  </div>
</div>

<div class="card">
  <p class="q"><span class="step">2</span><span data-i18n="q2"></span></p>
  <p class="hint" data-i18n="q2h"></p>
  <div class="zonekey">
    <span class="zk acc" data-i18n="zoneAccept"></span>
    <span class="zk rather" data-i18n="zoneRather"></span>
    <span class="zk dnw" data-i18n="zoneDnw"></span>
  </div>
  <p class="hint" data-i18n="zoneOrderNote" style="margin:0 0 8px"></p>
  <div class="listtools">
    <button class="tool" id="sortMarks" data-i18n="sortMarks"></button>
    <button class="tool" id="toggleMarks"></button>
  </div>
  <div class="ranklist" id="rankList"></div>
  <div class="warnmsg" id="dnwWarn"></div>
  <div id="mustWrap" class="selrow" style="margin-top:10px;display:none">
    <span data-i18n="musthave_q"></span> <select id="m_must"></select>
  </div>
  <p class="hint" data-i18n="marks_hint" style="margin-top:12px;margin-bottom:0"></p>
</div>

<div class="card">
  <p class="q"><span class="step">3</span><span data-i18n="q4"></span></p>
  <p class="remark" data-i18n="q4remark"></p>
  <div class="opts" id="q_m23">
    <div class="opt" data-v="Y"><b data-i18n="m2y"></b></div>
    <div class="opt" data-v="N"><b data-i18n="m2n"></b></div>
  </div>
  <div id="m2sWrap" style="display:none;margin-top:10px">
    <p class="hint" data-i18n="m2strength_q" style="margin-bottom:6px"></p>
    <div class="opts" id="q_m2s">
      <div class="opt on" data-v="block"><b data-i18n="m2block"></b><span data-i18n="m2block_s"></span></div>
      <div class="opt" data-v="tie"><b data-i18n="m2tie"></b><span data-i18n="m2tie_s"></span></div>
    </div>
  </div>
</div>

<div class="card">
  <p class="q"><span class="step">4</span><span data-i18n="qCareer"></span></p>
  <div class="opts" id="q_career">
    <div class="opt" data-v="science"><b data-i18n="carSci"></b></div>
    <div class="opt" data-v="business"><b data-i18n="carBiz"></b></div>
    <div class="opt" data-v="arts"><b data-i18n="carArts"></b></div>
    <div class="opt on" data-v="undecided"><b data-i18n="carUnd"></b></div>
  </div>
</div>

<div class="card">
  <p class="q"><span class="step">5</span><span data-i18n="qPair"></span></p>
  <p class="hint" data-i18n="qPairH"></p>
  <div class="opts" id="q_pair">
    <div class="opt on" data-v="none"><b data-i18n="pairNone"></b></div>
    <div class="opt" data-v="together"><b data-i18n="pairTogether"></b></div>
  </div>
  <div id="pairPickWrap" class="selrow" style="display:none;margin-top:10px">
    <select id="pairA"></select> <span data-i18n="pairAnd"></span> <select id="pairB"></select>
  </div>
</div>

<div id="contraBox"></div>
<div class="warnmsg" id="orderNudge"></div>
<button class="go" id="go" disabled data-i18n="go"></button>

<div class="card" id="out">
  <h2 id="outHead" style="margin-top:0"></h2>
  <p class="hint" id="topcap"></p>
  <div id="topList"></div>
  <div id="advBox"></div>
  <div class="actions">
    <button class="btn primary" id="dl"></button>
    <button class="btn" id="dlMarks"></button>
    <button class="btn" id="pdf"></button>
    <button class="btn" id="restart"></button>
  </div>
  <details>
    <summary id="showFull"></summary>

      SIZE_SLIGHT=250, M2_3_BLOCK=2000, M2_3_TIE=6, P_RATHER=400, P_PAIR=40, B_CAREER=8;

function weightsOf(liked){ const w={}; liked.forEach((s,i)=>{ if(w[s]===undefined) w[s]=Math.max(W_FLOOR, W_TOP-i*W_STEP); }); return w; }
function scoreCombo(c,w,dnw,must,rather,size,sizeFirm,m2_3,m2Block,career,pairType,pair){
  let s=0; for(const sub of c.subs) s+=(w[sub]||0);
  for(const sub of c.subs){ if(dnw.includes(sub)) s-=P_DNW; if(rather.includes(sub)) s-=P_RATHER; }
  if(must && !c.subs.includes(must)) s-=P_MUST;
  if((size==="2"||size==="3") && c.n===+size) s+= sizeFirm?SIZE_FIRM:SIZE_SLIGHT;
  if(c.m2_3){ const d=m2Block?M2_3_BLOCK:M2_3_TIE; s+= m2_3==="Y"?d : m2_3==="N"?-d : 0; }
  if(CAREER[career]) for(const sub of c.subs) if(CAREER[career].includes(sub)) s+=B_CAREER;
  if(pairType && pair && pair[0] && pair[1]){ const ina=c.subs.includes(pair[0]), inb=c.subs.includes(pair[1]);
    if(pairType==="together" && ina!==inb) s-=P_PAIR; else if(pairType==="apart" && ina&&inb) s-=P_PAIR; }
  return s;
}
function generate(liked,dnw,must,rather,size,sizeFirm,m2_3,m2Block,career,pairType,pair){

  scored.sort((a,b)=> b.sc-a.sc || a.c.code-b.c.code);
  const rank={}; scored.forEach((o,i)=> rank[o.c.code]=i+1);
  return {scored, rank};
}

let LANG=(function(){try{return localStorage.getItem('clp_lang')==='zh'?'zh':'en';}catch(e){return 'en';}})(), LAST=null, dragFrom=null;
// S.order = all 11 electives ranked (0 = most preferred). Two lines split it into three zones:
//   acceptable = order[0 .. ratherAt-1]  (ranked -> liked weights)
//   rather-not = order[ratherAt .. dnwAt-1]
//   won't-take = order[dnwAt ..]          (<=3)
const S = { size:null, size_firm:true, order:SUBJECTS.slice(), ratherAt:SUBJECTS.length, dnwAt:SUBJECTS.length,
            must:null, m2_3:null, m2_3_block:true, career:'undecided', pair_type:null, pair:[null,null], marks:{},
            manualOrder:false, marksHidden:false };
function zonesOf(){ return { acc:S.order.slice(0,S.ratherAt), rather:S.order.slice(S.ratherAt,S.dnwAt), dnw:S.order.slice(S.dnwAt) }; }
const DEFAULT_ORDER = SUBJECTS.slice();
function orderIsDefault(){ return S.order.length===DEFAULT_ORDER.length && S.order.every((s,i)=>s===DEFAULT_ORDER[i]); }
// #1 helpful starting order: float Direction-aligned subjects to the top (only until the student ranks manually)
function seedByDirection(dir){ if(!CAREER[dir]) return;
  const a=S.order.filter(s=>CAREER[dir].includes(s)), b=S.order.filter(s=>!CAREER[dir].includes(s)); S.order=[...a,...b]; }
// #1/#5 bulk sort by entered Half-yearly mark (desc; blanks last; stable)
function sortByMarks(){ S.manualOrder=true;
  S.order = S.order.map((s,i)=>[s,i]).sort((p,q)=>{
    const mp=parseFloat((S.marks[p[0]]||{}).mark), mq=parseFloat((S.marks[q[0]]||{}).mark);
    return (isNaN(mq)?-1:mq)-(isNaN(mp)?-1:mp) || p[1]-q[1];
  }).map(x=>x[0]);
  renderList(); refresh(); }
// #5 collapse the marks rows to shorten the page
function toggleMarks(){ S.marksHidden=!S.marksHidden;
  document.getElementById('rankList').classList.toggle('nomarks', S.marksHidden); updateToolLabels(); }
function updateToolLabels(){ document.getElementById('toggleMarks').textContent = S.marksHidden?T[LANG].showMarks:T[LANG].hideMarks; }

const subjName = s => (SUBJ[s] ? SUBJ[s][LANG] : s);
const joinSubs = arr => arr.map(subjName).join(LANG==='zh' ? '、' : ', ');
const val = id => document.getElementById(id).value.trim();
const L = (en,zh) => `${en}　${zh}`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fillSelect(sel, items, noneLabel, current){
  sel.innerHTML='';
  if(noneLabel!=null){ const o=document.createElement('option'); o.value=''; o.textContent=noneLabel; sel.appendChild(o); }
  items.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=subjName(s); sel.appendChild(o); });
  sel.value = (current && items.includes(current)) ? current : '';
}
function fillMustSelect(){
  const acc=zonesOf().acc;
  if(!acc.includes(S.must)) S.must=null;
  fillSelect(document.getElementById('m_must'), acc, T[LANG].musthave_none, S.must);
  document.getElementById('mustWrap').style.display = acc.length ? 'flex' : 'none';
}
function fillPairSelects(){
  fillSelect(document.getElementById('pairA'), SUBJECTS, '—', S.pair[0]);
  fillSelect(document.getElementById('pairB'), SUBJECTS, '—', S.pair[1]);
}

function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = T[LANG][el.dataset.i18n] || '');
  document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder = T[LANG][el.dataset.i18nPh] || '');
  ['outHead','topcap','showFull','submitNote'].forEach(id=> document.getElementById(id).textContent = T[LANG][id]);
  ['dl','dlMarks','pdf','restart'].forEach(id=> document.getElementById(id).textContent = T[LANG][id]);
  document.querySelectorAll('.langbtn').forEach(b=> b.classList.toggle('on', b.dataset.l===LANG));
  document.querySelectorAll('.home-link').forEach(a=> a.textContent = LANG==='zh' ? '← 返回主頁' : '← Back to home');
  renderList(); updateContra(); fillPairSelects(); updateToolLabels();
  document.getElementById('orderNudge').textContent = (S.size && orderIsDefault()) ? T[LANG].orderNudge : '';
  if(LAST) renderResults();
}
document.querySelectorAll('.langbtn').forEach(b=> b.onclick = ()=>{ LANG=b.dataset.l; try{localStorage.setItem('clp_lang',LANG);}catch(e){} applyLang(); });

function pickOne(boxId, fn){
  document.querySelectorAll('#'+boxId+' .opt').forEach(el=>{
    el.onclick=()=>{ document.querySelectorAll('#'+boxId+' .opt').forEach(x=>x.classList.toggle('on',x===el));
      fn(el.dataset.v); refresh(); };
  });

pickOne('q_size', v=>{ S.size=v; document.getElementById('firmWrap').style.display=(v==='2'||v==='3')?'block':'none'; });
pickOne('q_firm', v=>{ S.size_firm=(v==='firm'); });
pickOne('q_m23', v=>{ S.m2_3=v; document.getElementById('m2sWrap').style.display=(v==='Y'||v==='N')?'block':'none'; });
pickOne('q_m2s', v=>{ S.m2_3_block=(v==='block'); });
pickOne('q_career', v=>{ S.career=v; if(!S.manualOrder){ seedByDirection(v); renderList(); } });
pickOne('q_pair', v=>{ S.pair_type=(v==='none'?null:v); document.getElementById('pairPickWrap').style.display=(v==='none')?'none':'flex'; });
document.getElementById('m_must').onchange = e=>{ S.must = e.target.value || null; };
document.getElementById('pairA').onchange = e=>{ S.pair[0] = e.target.value || null; };
document.getElementById('pairB').onchange = e=>{ S.pair[1] = e.target.value || null; };

function flash(){ const w=document.getElementById('dnwWarn'); w.textContent=T[LANG].q3warn; setTimeout(()=>w.textContent='',1800); }

function marksRowEl(s){
  const mi=markInfo(s), mk=(S.marks[s] = S.marks[s] || {mark:'',rank:'',grade:''});
  const marks=document.createElement('div'); marks.className='marksrow';
  const hy = `<span class="hylab">${T[LANG].hy_label}:</span>`;
  const note = mi[LANG] ? `<span class="mknote">${esc(mi[LANG])}</span>` : '';
  if(mi.type==='grade'){
    marks.innerHTML = `${hy}${note}<label>${T[LANG].grade_label} <input type="text" data-mk="grade" value="${esc(mk.grade)}" maxlength="3"></label>`;
  } else {
    marks.innerHTML = `${hy}${note}<label>${T[LANG].mark_label} <input type="number" min="0" max="100" data-mk="mark" value="${esc(mk.mark)}"></label>`
      + `<label>${T[LANG].rank_label} <input type="number" min="1" data-mk="rank" value="${esc(mk.rank)}"></label>`;
  }
  marks.querySelectorAll('input').forEach(inp=>{
    inp.oninput=()=>{ S.marks[s][inp.dataset.mk]=inp.value; };
    inp.onchange=()=>{                       // #7 light validation on blur
      if(inp.type==='number'){ let v=inp.value.trim();
        if(v!==''){ let n=parseFloat(v); if(!isNaN(n)){
          if(inp.dataset.mk==='mark') n=Math.max(0,Math.min(100,n));
          if(inp.dataset.mk==='rank') n=Math.max(1,Math.round(n));
          inp.value=String(n); } }
      } else { inp.value=inp.value.toUpperCase(); }
      S.marks[s][inp.dataset.mk]=inp.value; };
  });
  return marks;
}
function mkBtn(t,fn,dis){ const b=document.createElement('button'); b.textContent=t; b.onclick=fn; if(dis) b.disabled=true; return b; }

// reorder a subject; the two lines stay at their indices so a subject changes ZONE as it crosses one
function moveItem(from,to){ const n=S.order.length; if(to<0||to>=n||from===to||from<0||from>=n) return;
  S.manualOrder=true; const [x]=S.order.splice(from,1); S.order.splice(to,0,x); renderList(); refresh(); }
function moveRather(d){ S.manualOrder=true; S.ratherAt=Math.max(0,Math.min(S.dnwAt,S.ratherAt+d)); renderList(); refresh(); }
function moveDnw(d){ S.manualOrder=true; let nd=Math.max(S.ratherAt,Math.min(S.order.length,S.dnwAt+d));
  if(S.order.length-nd>3){ nd=S.order.length-3; flash(); } S.dnwAt=nd; renderList(); refresh(); }

function renderList(){
  const host=document.getElementById('rankList'); host.innerHTML='';
  host.classList.toggle('nomarks', S.marksHidden);
  const addDivider=(kind)=>{
    const d=document.createElement('div'); d.className='divider '+kind;
    d.innerHTML=`<span class="dlab">${kind==='rather'?T[LANG].lineRather:T[LANG].lineDnw}</span>`;
    const ctr=document.createElement('span'); ctr.className='rowbtns';
    const at = kind==='rather'?S.ratherAt:S.dnwAt;
    const upDis = kind==='rather' ? S.ratherAt<=0 : S.dnwAt<=S.ratherAt;
    const dnDis = kind==='rather' ? S.ratherAt>=S.dnwAt : S.dnwAt>=S.order.length;
    ctr.append(mkBtn('▲',()=> kind==='rather'?moveRather(-1):moveDnw(-1), upDis),
               mkBtn('▼',()=> kind==='rather'?moveRather(1):moveDnw(1), dnDis));
    d.appendChild(ctr);
    d.addEventListener('dragover',e=>e.preventDefault());
    d.addEventListener('drop',e=>{ e.preventDefault(); if(dragFrom!=null){ moveItem(dragFrom, dragFrom<at?Math.max(0,at-1):at); } dragFrom=null; });
    host.appendChild(d);
  };
  S.order.forEach((s,i)=>{
    if(i===S.ratherAt) addDivider('rather');
    if(i===S.dnwAt) addDivider('dnw');
    const zone = i<S.ratherAt?'acc':(i<S.dnwAt?'rather':'dnw');
    const li=document.createElement('div'); li.className='rankrow drag '+zone; li.draggable=true; li.dataset.i=i;
    li.addEventListener('dragstart',()=>{ dragFrom=i; });
    li.addEventListener('dragend',()=>{ dragFrom=null; document.querySelectorAll('.rankrow').forEach(r=>r.classList.remove('dragover')); });
    li.addEventListener('dragover',e=>{ e.preventDefault(); li.classList.add('dragover'); });
    li.addEventListener('dragleave',()=>li.classList.remove('dragover'));
    li.addEventListener('drop',e=>{ e.preventDefault(); li.classList.remove('dragover'); if(dragFrom!=null) moveItem(dragFrom,i); dragFrom=null; });
    const badge = zone==='acc' ? `<span class="ord">${i+1}</span>`
                                : `<span class="ordband ${zone}">${zone==='rather'?'~':'✕'}</span>`;
    const note = s==='M2(6)' ? `<small>${T[LANG].m26note}</small>` : '';
    const head=document.createElement('div'); head.className='rankhead';
    head.innerHTML=`${badge}<span class="nm">${esc(subjName(s))}${note}</span>`;
    const ctr=document.createElement('span'); ctr.className='rowbtns';
    const top=mkBtn('⤒',()=>moveItem(i,0), i===0); top.title=T[LANG].toTop;
    ctr.append(top, mkBtn('▲',()=>moveItem(i,i-1), i===0), mkBtn('▼',()=>moveItem(i,i+1), i===S.order.length-1));
    head.appendChild(ctr); li.appendChild(head);
    li.appendChild(marksRowEl(s)); host.appendChild(li);
  });
  if(S.ratherAt===S.order.length) addDivider('rather');
  if(S.dnwAt===S.order.length) addDivider('dnw');
  fillMustSelect();
}

function ready(){ return S.size && S.m2_3; }
function contradictions(){
  const z=zonesOf(), m=[];
  if(S.size==='2' && (z.acc.includes('M2(6)') || S.must==='M2(6)')) m.push(T[LANG].contraM26);
  if(S.size==='2' && S.must==='M2(6)') m.push(T[LANG].contraMustM26);
  if(S.size==='3' && ['BAFS','Phy','Bio'].every(s=>z.dnw.includes(s))) m.push(T[LANG].contra3anchor);
  return m;
}
function updateContra(){
  const m=contradictions();
  document.getElementById('contraBox').innerHTML =
    m.length ? `<div class="contra">${m.map(x=>`<div>${x}</div>`).join('')}</div>` : '';
}
function refresh(){ document.getElementById('go').disabled=!ready(); updateContra();
  document.getElementById('orderNudge').textContent = (S.size && orderIsDefault()) ? T[LANG].orderNudge : ''; }

function advisories(liked,dnw,must,size,m2_3,scored){
  const z = LANG==='zh', adv=[];
  const wantN = (size==='2'||size==='3') ? +size : null;
  if(size==='2' && (liked.includes('M2(6)') || must==='M2(6)')) adv.push(T[LANG].contraM26);
  if(size==='2' && must==='M2(6)') adv.push(T[LANG].contraMustM26);
  if(size==='3' && ['BAFS','Phy','Bio'].every(s=>dnw.includes(s))) adv.push(T[LANG].contra3anchor);
  if(m2_3==='Y') adv.push(T[LANG].q4remark);
  if(must){ const mn=subjName(must);
    adv.push(z ? `必修科：所有不含「${mn}」的組合都排在含有它的組合之後（共 ${scored.filter(o=>o.c.subs.includes(must)).length} 個含 ${mn} 的組合）。`
               : `Must-have: every combination without ${mn} sits below all ${scored.filter(o=>o.c.subs.includes(must)).length} combinations that include it.`); }
  if(wantN && liked.length>=wantN){
    const dream=liked.slice(0,wantN).slice().sort().join('|');
    const offered=COMBOS.some(c=>c.n===wantN && c.subs.slice().sort().join('|')===dream);
    if(!offered){ const names=liked.slice(0,wantN).map(subjName).join(z?'、':', ');
      adv.push(z ? `你最理想的 ${wantN} 科組合（${names}）並非學校提供的組合——上方第 1 志願是最接近的選擇。`
                 : `Your ideal ${wantN}-subject set (${names}) is not an offered combination — your #1 above is the closest available.`); }
  }
  if(dnw.length){
    const clean=scored.filter(o=>!o.c.subs.some(s=>dnw.includes(s)));
    const first=clean.length+1, names=dnw.map(subjName).join(z?'、':', ');
    adv.push(z ? `所有包含 ${names} 的組合，都排在 ${clean.length} 個不含它們的組合之後（不想修讀的組合由第 ${first} 位開始）。`
               : `Every combination containing ${names} sits below all ${clean.length} combinations without them (unwanted combinations start at #${first}).`);
    if(wantN && first<=60){ const cleanN=clean.filter(o=>o.c.n===wantN).length, other=wantN===3?'2':'3';
      adv.push(z ? `提提你：在這些「不想修讀」之下，你只有 ${cleanN} 個沒有衝突的 ${wantN} 科組合；不想修讀的組合最高去到第 ${first} 位。若覺得太高，可考慮把其中一個移回上方，或改選 ${other} 個選修科。`
                 : `Heads-up: with these won't-take subjects you only have ${cleanN} clean ${wantN}-elective option(s); they reach as high as #${first}. If that feels high, consider moving one back up or trying ${other} electives.`); }
  }
  return adv;
}

function renderResults(){
  const {scored,liked,dnw,must,size,m2_3}=LAST;
  const tl=document.getElementById('topList'); tl.innerHTML='';
  scored.slice(0,12).forEach((o,i)=>{
    const c=o.c, why=c.subs.filter(s=>liked.includes(s)).map(subjName);
    const bits=[]; if(why.length) bits.push(T[LANG].your + why.join(LANG==='zh'?'、':' + '));
    if(c.m2_3) bits.push('M2(3)'); if(c.has_m26) bits.push('M2(6)');
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<span class="rk">#${i+1}</span><span class="cl">${c.cls}</span>`+
      `<span>${joinSubs(c.subs)}</span>`+(bits.length?`<span class="why">${bits.join(' · ')}</span>`:'');
    tl.appendChild(row);
  });
  const adv=advisories(liked,dnw,must,size,m2_3,scored);
  document.getElementById('advBox').innerHTML = adv.length
    ? `<div class="adv"><b>${T[LANG].advHead}</b><ul>${adv.map(a=>`<li>${a}</li>`).join('')}</ul></div>` : '';
  const ft=document.getElementById('fullTable'); ft.innerHTML='';
  scored.forEach((o,i)=>{ const c=o.c; const tr=document.createElement('tr');
    tr.innerHTML=`<td>#${i+1}</td><td>${c.cls}</td><td>${c.m2_3?'M2(3)':''}</td><td>${joinSubs(c.subs)}</td>`; ft.appendChild(tr); });
}

function slipSVG(){
  const w=1240, h=1754;
  const inner = `<div xmlns="http://www.w3.org/1999/xhtml" class="doc"><style>${PDF_STYLE}</style>${buildSlipHTML()}</div>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><foreignObject x="0" y="0" width="${w}" height="${h}">${inner}</foreignObject></svg>`;
}
function downloadJpegPDF(dataURL, iw, ih, name){
  const bin=atob(dataURL.split(',')[1]);
  const pw=(iw*72/150).toFixed(2), ph=(ih*72/150).toFixed(2);   // 150 dpi -> ~595x842 pt (A4)
  let pdf=''; const off=[]; const add=s=>{ pdf+=s; };
  add('%PDF-1.3\n');
  off[1]=pdf.length; add('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  off[2]=pdf.length; add('2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n');
  off[3]=pdf.length; add(`3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n`);
  off[4]=pdf.length; add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bin.length}>>\nstream\n`+bin+'\nendstream\nendobj\n');
  const cont=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  off[5]=pdf.length; add(`5 0 obj\n<</Length ${cont.length}>>\nstream\n${cont}\nendstream\nendobj\n`);
  const xref=pdf.length;
  add('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++) add(String(off[i]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  a.download=name+'.pdf'; a.click();
}
function buildPDF(){
  const cls=val('m_class'), no=val('m_no');
  const fname=`F4_reply_slip_${cls||'student'}_${no||''}`.replace(/_+$/,'');
  const img=new Image();
  img.onload=()=>{
    try{
      const c=document.createElement('canvas'); c.width=1240; c.height=1754;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,1240,1754); ctx.drawImage(img,0,0);
      downloadJpegPDF(c.toDataURL('image/jpeg',0.92), 1240, 1754, fname);
    }catch(e){ document.getElementById('printArea').innerHTML=buildSlipHTML(); window.print(); }
  };
  img.onerror=()=>{ document.getElementById('printArea').innerHTML=buildSlipHTML(); window.print(); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(slipSVG());
}

<script>
(function(){
  var STORED='b5c420ee2fab1b2ca51dbf0a98cf5678ea44652ec86736edc2f727e3e68d4517'; // SHA-256 of the passcode
  var KEY='streaming_pass';
  var lock=document.getElementById('lock'), app=document.getElementById('app');
  var inp=document.getElementById('passcode'), btn=document.getElementById('unlock-btn'), err=document.getElementById('lock-err');
  function reveal(){ lock.style.display='none'; app.style.display='block'; }
  function sha256hex(str){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    });
  }
  function tryUnlock(){
    err.textContent='';
    var v=inp.value||'';
    if(!v) return;
    sha256hex(v).then(function(h){
      if(h===STORED){ try{ localStorage.setItem(KEY,h); }catch(e){} reveal(); }
      else { err.textContent='Incorrect passcode　通行碼不正確'; inp.value=''; inp.focus(); }
    }).catch(function(){ err.textContent='This browser cannot verify the passcode.'; });
  }
  try{ if(localStorage.getItem(KEY)===STORED) reveal(); }catch(e){}
  btn.addEventListener('click', tryUnlock);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); tryUnlock(); } });
  inp.focus();
})();
</script>
